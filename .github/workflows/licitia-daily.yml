# The one ingestion step that cannot run on Vercel.
#
# LicitIA discovery downloads a 15-lote, ~372k-row bulk corpus and then makes
# one detail lookup per newly-discovered procedure; link resolution is one
# sequential HTTP request per unresolved tender. That is minutes of work, so it
# does not fit a serverless function's request ceiling at any plan — see
# lib/ingestion/README.md. Colombia and PEMEX run as Vercel crons; this runs
# here, against the same Supabase database.
name: LicitIA daily import

on:
  schedule:
    # 04:40 UTC — after the two Vercel crons (04:00 Colombia, 04:20 PEMEX), so
    # a day's imports land in a predictable order and an admin reading the
    # morning state sees one coherent picture.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "真的写入 Supabase（不勾就是试运行）"
        type: boolean
        default: false

# A run takes minutes; two overlapping runs would race on the same upserts.
concurrency:
  group: licitia-daily
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # Generous but finite: the corpus download dominates, and a run still
    # hanging after half an hour is stuck, not slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Scheduled runs always write; a manual run writes only when asked, so
        # the workflow can be exercised safely before it is trusted.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write }}" = "true" ]; then
            npm run licitia:daily -- --write
          else
            npm run licitia:daily
          fi

      - name: Upload the excluded-tenders CSV
        # Runs even when the import failed — a partial export is still the
        # fastest way to see what the relevance rules rejected today.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licitia-excluded-${{ github.run_id }}
          path: exports/
          if-no-files-found: ignore
          retention-days: 14
