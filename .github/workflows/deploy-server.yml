name: Deploy to server

# Builds the site on GitHub's runner and switches the self-hosted server
# (deploy/) to it, the way Vercel deployed on every merge.
#
# Built here, not on the server: `next build` needs ~2.8 GB, and on the 2 GB
# server it pushed everything into swap and froze the machine (2026-11-20).
# The runner builds at the server's own path, /srv/latintender/releases/<sha>,
# so nothing in `.next` points somewhere the server does not have. `.next`
# (~25 MB compressed) is uploaded, and node_modules (~160 MB) only when
# package-lock.json changed; the server never runs `npm ci` (deploy/deploy.sh).
#
# The build gets only what deploy/build-env.sh lets out of the server's .env:
# the Supabase read key (the prerendered pages read real tenders, and without
# it they fall back to mock data) and public, non-secret configuration.
# Payments, email, AI, the GitHub token and CRON_SECRET stay on the server.
# What the runner does get is deleted after the build; nothing is stored in
# GitHub.
#
# Skipped, not failed, until DEPLOY_HOST, DEPLOY_SSH_KEY and
# DEPLOY_KNOWN_HOSTS exist. See deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when the server is not configured
        if: env.DEPLOY_HOST == ''
        run: echo "DEPLOY_HOST 未设置，跳过部署（见 deploy/README.md）"

      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''

      - uses: actions/setup-node@v4
        if: env.DEPLOY_HOST != ''
        with:
          node-version: 22

      - name: SSH key
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User latintender\n  IdentityFile ~/.ssh/deploy_key\n  BatchMode yes\n  ServerAliveInterval 30\n' "$DEPLOY_HOST" > ~/.ssh/config

      - name: Update the server's checkout
        if: env.DEPLOY_HOST != ''
        # So deploy.sh, build-env.sh and cron-call.sh on the server are this
        # commit's before anything below runs them.
        run: ssh server "git -C /srv/latintender/repo fetch -q origin $GITHUB_SHA && git -C /srv/latintender/repo checkout -q -B main FETCH_HEAD"

      - name: Build at the server's path
        if: env.DEPLOY_HOST != ''
        run: |
          REL="/srv/latintender/releases/$GITHUB_SHA"
          sudo mkdir -p "$REL" && sudo chown "$USER" "$REL"
          git archive HEAD | tar -x -C "$REL"
          ( umask 077; ssh server "bash /srv/latintender/repo/deploy/build-env.sh" > "$REL/.env.production.local" )
          grep -oE '^[A-Z0-9_]+' "$REL/.env.production.local" | tr '\n' ' '; echo
          cd "$REL"
          npm ci --no-audit --no-fund
          NEXT_TELEMETRY_DISABLED=1 npx next build
          rm -f "$REL/.env.production.local"
          tar --exclude=.next/cache -czf "$RUNNER_TEMP/next.tgz" .next
          ls -lh "$RUNNER_TEMP/next.tgz"

      - name: Upload
        if: env.DEPLOY_HOST != ''
        run: |
          ssh server "mkdir -p /srv/latintender/incoming"
          scp -q "$RUNNER_TEMP/next.tgz" "server:/srv/latintender/incoming/$GITHUB_SHA.tgz"
          # node_modules too, but only when the lockfile differs from the one
          # being served: the server never runs `npm ci` (next to a running
          # site it froze the 2 GB machine, 2026-11-20), and otherwise reuses
          # the served release's node_modules. ~160 MB when it is needed.
          REL="/srv/latintender/releases/$GITHUB_SHA"
          here="$(sha256sum "$REL/package-lock.json" | cut -d' ' -f1)"
          there="$(ssh server "sha256sum /srv/latintender/current/package-lock.json 2>/dev/null | cut -d' ' -f1" || true)"
          if [ "$here" != "$there" ]; then
            echo "package-lock.json 有变化，上传装好的依赖"
            tar -czf "$RUNNER_TEMP/node_modules.tgz" -C "$REL" node_modules
            ls -lh "$RUNNER_TEMP/node_modules.tgz"
            scp -q "$RUNNER_TEMP/node_modules.tgz" "server:/srv/latintender/incoming/$GITHUB_SHA.node_modules.tgz"
          else
            echo "依赖没有变化，服务器沿用现有依赖"
          fi

      - name: Switch
        if: env.DEPLOY_HOST != ''
        run: |
          # Started detached and polled, so a dropped SSH connection no longer
          # stops it halfway (2026-11-20). deploy.sh writes "<sha> <exit code>"
          # to logs/deploy-status when it ends, whichever way.
          ssh server "rm -f /srv/latintender/logs/deploy-status; setsid nohup bash /srv/latintender/repo/deploy/deploy.sh $GITHUB_SHA > /dev/null 2>&1 < /dev/null & echo started"
          for _ in $(seq 1 60); do
            sleep 10
            status="$(ssh server "cat /srv/latintender/logs/deploy-status 2>/dev/null" || true)"
            case "$status" in
              "$GITHUB_SHA 0") ssh server "tail -n 8 /srv/latintender/logs/deploy.log"; exit 0 ;;
              "$GITHUB_SHA "*) ssh server "tail -n 25 /srv/latintender/logs/deploy.log"; exit 1 ;;
            esac
          done
          echo "部署 10 分钟还没有结束"
          ssh server "tail -n 25 /srv/latintender/logs/deploy.log" || true
          exit 1

      - name: Remove the copied .env
        if: always() && env.DEPLOY_HOST != ''
        run: rm -f "/srv/latintender/releases/$GITHUB_SHA/.env.production.local" ~/.ssh/deploy_key
