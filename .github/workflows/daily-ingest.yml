# Every ingestion source that can run unattended, on one schedule, off Vercel.
#
# WHY HERE AND NOT AS VERCEL CRONS (they were, briefly, and worked):
#
#  - No request ceiling. PEMEX has seven subsidiary lists and as a serverless
#    route had to run them under a 42-second budget with the order rotating by
#    day, so a given subsidiary was only reached every few days. Here all seven
#    run every day. LicitIA never fit at all — it downloads a 15-lote, ~372k-row
#    corpus and then makes one detail lookup per new procedure.
#  - Logs that outlive the incident, a re-run button, and a failure email.
#  - No cron-count limit to plan around.
#
# The cost, stated plainly: the Supabase service-role key (which bypasses RLS)
# lives in this repository's secrets as well as in Vercel, and GitHub's
# scheduler is best-effort — a run can start tens of minutes late. Neither
# matters for a nightly import; both are worth knowing when rotating keys or
# reading a heartbeat.
#
# The public tender list is cached for five minutes (lib/cache-tags.ts) and a
# CLI write cannot invalidate it, so new tenders appear up to five minutes
# after a run.
#
# WHEN THIS RUNS, AND WHY IT MOVED (2026-09-18, 04:00 -> 11:17 UTC).
#
# Colombia and Peru are UTC-5, Mexico City UTC-6. At 04:00 UTC the run landed
# at 23:00 the PREVIOUS EVENING in Bogotá and Lima — the very end of the day
# whose publications it was trying to collect, giving the open-data mirrors
# essentially no time to sync them. A tender an entity published on the
# evening of the 15th was therefore not in datos.gov.co when that night's run
# read it, and waited for the next one, 24 hours later — which is exactly the
# "published 9/15, only appeared in the 9/17 import" the user reported for
# both countries.
#
# 11:17 UTC is 06:17 in Bogotá and Lima, 05:17 in Mexico City: the morning
# AFTER, with the whole night for the source to catch up. Nothing else
# changes — the import window is a month wide, so this only moves WHEN a
# given day's tenders are first seen, never which ones are eligible.
#
# The cost, stated plainly: fresh rows now land at 19:17 Beijing rather than
# 12:17, so a Chinese customer checking at lunchtime sees data imported the
# previous evening instead of that morning. That is one day's worth either
# way; being a day late to the tender itself is the larger loss.
#
# :17 rather than :00 because GitHub's scheduler is best-effort and the top of
# the hour is the most contended minute there is.
#
# NOT fixed by this: Peru has no scheduled import at all, so every Peru row is
# still imported by hand. Brazil joined the matrix on 2026-09-19.
name: Daily ingest

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "真的写入 Supabase（不勾就是试运行）"
        type: boolean
        default: false

# Two overlapping runs would race on the same upserts.
concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One source failing must not stop the others — they share nothing but
      # the database, and a PEMEX outage is not a reason to skip Colombia.
      fail-fast: false
      matrix:
        include:
          - name: Colombia (SECOP II)
            command: cron:colombia
          - name: PEMEX
            command: cron:pemex
          - name: LicitIA (Compras MX)
            command: licitia:daily
          # Added 2026-09-19. Brazil had no scheduled import and was run by
          # hand from the user's laptop, which PNCP has now refused twice in
          # one day — a 78-row run where every amount lookup was rejected, and
          # then a run where page 1 of both modalities died on a connection
          # reset before a single row was read. The deployment reaches PNCP
          # from a different egress; this runner is a third one, and the point
          # of putting the job here is that a refused night is visible in a log
          # with a re-run button instead of being a terminal the user is
          # watching. The script's default window is 3 days, which also covers
          # a night that fails outright.
          - name: Brazil (PNCP)
            command: ingest:brazil-live
          # Added 2026-09-25, when the user opened Chile. Mercado Público's
          # public search (the busca door), every open tender each run, with
          # each kept row's closing date read from its own ficha — see
          # scripts/cron-chile.ts. Heavier than it looks only if the rules
          # start keeping thousands; ENRICH_LIMIT caps that.
          - name: Chile (Mercado Público)
            command: cron:chile
          # Added 2026-09-25. Petrobras and Transpetro publish nothing on PNCP
          # (Lei 13.303); their own portal serves every open opportunity in
          # one public request. See scripts/cron-petronect.ts.
          - name: Petrobras (Petronect)
            command: cron:petronect
          # Added 2026-09-25. Colombia's transmission-expansion calls (investor
          # selection for new substations and lines) — UPME's own process, not
          # on SECOP. See scripts/cron-upme.ts.
          - name: Colombia (UPME transmission)
            command: cron:upme
          # Added 2026-09-25. Codelco is outside Ley 19.886 and absent from
          # Mercado Público; its site lists the few calls it opens publicly.
          # See scripts/cron-codelco.ts.
          - name: Chile (Codelco)
            command: cron:codelco
          # Added 2026-09-25. Cemig's own e-Compras portal (Lei 13.303), where
          # it buys grid equipment by pregão — the one source where a pregão
          # for goods is kept. See scripts/cron-cemig.ts.
          - name: Brazil (Cemig)
            command: cron:cemig
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # A scheduled run always writes; a manual run writes only when asked,
        # so the whole thing can be exercised before it is trusted.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write }}" = "true" ]; then
            npm run ${{ matrix.command }} -- --write
          else
            npm run ${{ matrix.command }}
          fi

      - name: Upload the excluded-tenders CSV
        # Runs even on failure — a partial export is still the fastest way to
        # see what the relevance rules rejected today.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: excluded-${{ strategy.job-index }}-${{ github.run_id }}
          path: exports/
          if-no-files-found: ignore
          retention-days: 14

  # Tells Bing about the pages that became public today, after the imports
  # that may have created them. Bing's index is what ChatGPT and Copilot read,
  # so this is the only channel through which an AI assistant learns this site
  # exists — Google Search Console covers Google and nothing else.
  #
  # Needs the imports to have finished, but must not be skipped when one of
  # them fails: a PEMEX outage has nothing to do with yesterday's Colombia
  # tenders crossing their deadline, and those pages are the point.
  indexnow:
    needs: ingest
    if: always() && (github.event_name == 'schedule' || inputs.write)
    runs-on: ubuntu-latest
    name: IndexNow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Submit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Public information (it is the site's own address), so it is stated
          # here rather than kept as a secret nobody can read back.
          APP_URL: https://latintender.com
        run: npm run ping:indexnow -- --write
