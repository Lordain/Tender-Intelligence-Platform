# Every ingestion source that can run unattended, on one schedule, off Vercel.
#
# WHY HERE AND NOT AS VERCEL CRONS (they were, briefly, and worked):
#
#  - No request ceiling. PEMEX has seven subsidiary lists and as a serverless
#    route had to run them under a 42-second budget with the order rotating by
#    day, so a given subsidiary was only reached every few days. Here all seven
#    run every day. LicitIA never fit at all — it downloads a 15-lote, ~372k-row
#    corpus and then makes one detail lookup per new procedure.
#  - Logs that outlive the incident, a re-run button, and a failure email.
#  - No cron-count limit to plan around.
#
# The cost, stated plainly: the Supabase service-role key (which bypasses RLS)
# lives in this repository's secrets as well as in Vercel, and GitHub's
# scheduler is best-effort — a run can start tens of minutes late. Neither
# matters for a nightly import; both are worth knowing when rotating keys or
# reading a heartbeat.
#
# The public tender list is cached for five minutes (lib/cache-tags.ts) and a
# CLI write cannot invalidate it, so new tenders appear up to five minutes
# after a run.
#
# WHEN THIS RUNS, AND WHY IT MOVED (2026-09-18, 04:00 -> 11:17 UTC).
#
# Colombia and Peru are UTC-5, Mexico City UTC-6. At 04:00 UTC the run landed
# at 23:00 the PREVIOUS EVENING in Bogotá and Lima — the very end of the day
# whose publications it was trying to collect, giving the open-data mirrors
# essentially no time to sync them. A tender an entity published on the
# evening of the 15th was therefore not in datos.gov.co when that night's run
# read it, and waited for the next one, 24 hours later — which is exactly the
# "published 9/15, only appeared in the 9/17 import" the user reported for
# both countries.
#
# 11:17 UTC is 06:17 in Bogotá and Lima, 05:17 in Mexico City: the morning
# AFTER, with the whole night for the source to catch up. Nothing else
# changes — the import window is a month wide, so this only moves WHEN a
# given day's tenders are first seen, never which ones are eligible.
#
# The cost, stated plainly: fresh rows now land at 19:17 Beijing rather than
# 12:17, so a Chinese customer checking at lunchtime sees data imported the
# previous evening instead of that morning. That is one day's worth either
# way; being a day late to the tender itself is the larger loss.
#
# :17 rather than :00 because GitHub's scheduler is best-effort and the top of
# the hour is the most contended minute there is.
#
# TWICE A DAY, STARTED BY VERCEL (2026-10-04; user: 能不能设定成每天跑2次? and
# 改成由 Vercel 定时去触发 GitHub ← OK).
#
# GitHub started the scheduled run 4 to 7 hours late every day of
# 2026-09-27..10-04 (15:08 to 18:35 UTC for an 11:17 schedule). A Vercel cron
# on Hobby fires within the hour it names, so the clock now lives there:
# app/api/cron/trigger-daily-ingest calls workflow_dispatch with via=vercel —
#
#   pass=full   11:xx UTC  06:xx Bogotá/Lima, 19:xx Beijing   every job
#   pass=light  21:xx UTC  16:xx Bogotá/Lima, 05:xx Beijing   the afternoon's
#               publications, in before the 00:00 UTC digest and before a
#               Chinese customer starts work
#
# Every import reads a window of days and upserts, so the second pass only
# adds what is new. Only the IndexNow/Baidu push stays on the full pass:
# Baidu's quota is small and resets daily, so a second push is refused.
#
# The status refresh (and the award lookup behind it) runs on both passes
# since 2026-10-06 (user: 两次都刷新状态，搜索引擎推送每天一次), so an award
# or cancellation reaches the 00:00 UTC digest the same day instead of waiting
# for the evening. It re-asks Brazil, Chile and Mexico about every tender
# already stored, ~15 minutes against sources that throttle; if one starts
# refusing the second run, put `once_daily: true` back on that matrix entry.
#
# The schedules below are the FALLBACK, an hour after each Vercel slot, for a
# day the trigger fails (token expired, Vercel down) or before
# GITHUB_DISPATCH_TOKEN is set. The gate job lets a scheduled run through
# only when no Vercel run of the same pass was created in the last 8 hours,
# so a healthy day runs each pass once, not twice.
#
# NOT fixed by this: Peru's SEACE/OECE rows are still imported by hand (its
# proxy refuses datacenter ranges). Brazil joined the matrix on 2026-09-19,
# Peru's Petroperú and OxI on 2026-09-25 and 2026-09-26.
name: Daily ingest

on:
  schedule:
    # Fallback for the full pass. The gate job maps the line below to the
    # light pass by its text — change both together.
    - cron: "17 12 * * *"
    # Fallback for the light pass.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "真的写入 Supabase（不勾就是试运行）"
        type: boolean
        default: false
      pass:
        description: "full：全部任务；light：不跑搜索引擎推送"
        type: choice
        options: [full, light]
        default: full
      via:
        description: "谁触发的（Vercel 定时填 vercel；手动运行不用改）"
        type: string
        default: manual

# The fallback schedule finds Vercel's runs by this name.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Daily ingest ({0}, {1})', inputs.via, inputs.pass) || format('Daily ingest (schedule {0})', github.event.schedule) }}

# Two overlapping runs would race on the same upserts.
concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  # Which pass this is, and whether a scheduled (fallback) run should go ahead.
  # Fails open: if GitHub's API cannot be read, the run goes ahead — a pass
  # run twice only re-upserts the same rows, a pass skipped loses a day.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pass: ${{ steps.decide.outputs.pass }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_PASS: ${{ inputs.pass }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "pass=${INPUT_PASS:-full}" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SCHEDULE" = "17 22 * * *" ]; then pass=light; else pass=full; fi
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          since=$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          if count=$(gh api "repos/$REPO/actions/workflows/daily-ingest.yml/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=50" \
              --jq "[.workflow_runs[] | select(.display_title == \"Daily ingest (vercel, $pass)\")] | length"); then
            if [ "$count" -gt 0 ]; then
              echo "Vercel already started the $pass pass since $since; nothing to do."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No Vercel-started $pass pass since $since; running it now."
          else
            echo "::warning::Could not list this workflow's runs; running the $pass pass anyway."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  ingest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One source failing must not stop the others — they share nothing but
      # the database, and a PEMEX outage is not a reason to skip Colombia.
      fail-fast: false
      matrix:
        include:
          - name: Colombia (SECOP II)
            command: cron:colombia
          - name: PEMEX
            command: cron:pemex
          - name: LicitIA (Compras MX)
            command: licitia:daily
          # Added 2026-09-19. Brazil had no scheduled import and was run by
          # hand from the user's laptop, which PNCP has now refused twice in
          # one day — a 78-row run where every amount lookup was rejected, and
          # then a run where page 1 of both modalities died on a connection
          # reset before a single row was read. The deployment reaches PNCP
          # from a different egress; this runner is a third one, and the point
          # of putting the job here is that a refused night is visible in a log
          # with a re-run button instead of being a terminal the user is
          # watching. The script's default window is 3 days, which also covers
          # a night that fails outright.
          - name: Brazil (PNCP)
            command: ingest:brazil-live
          # Added 2026-10-02 (user: 巴西电子竞价加进每日自动导入 ← OK). The
          # Concorrência job above is works by law; equipment comes through
          # Pregão Eletrônico, read here for five equipment classes at US$ 2M
          # and up (lib/relevance-pncp-pregao.ts). Its own job and heartbeat:
          # three days of pregões are ~9,000 rows, ~90 list pages, and a night
          # PNCP throttles that sweep should not mark the works import failed.
          - name: Brazil (PNCP Pregão, equipment)
            command: cron:brazil-pregao
          # Added 2026-09-25, when the user opened Chile. Mercado Público's
          # public search (the busca door): every open tender is read, those
          # published in the last 3 days are kept (user, 2026-09-25), each
          # with its closing date read from its own ficha — see
          # scripts/cron-chile.ts. Heavier than it looks only if the rules
          # start keeping thousands; ENRICH_LIMIT caps that.
          - name: Chile (Mercado Público)
            command: cron:chile
          # Added 2026-09-25. Petrobras and Transpetro publish nothing on PNCP
          # (Lei 13.303); their own portal serves every open opportunity in
          # one public request. See scripts/cron-petronect.ts.
          - name: Petrobras (Petronect)
            command: cron:petronect
          # Added 2026-09-25. Colombia's transmission-expansion calls (investor
          # selection for new substations and lines) — UPME's own process, not
          # on SECOP. See scripts/cron-upme.ts.
          - name: Colombia (UPME transmission)
            command: cron:upme
          # Added 2026-09-25. Codelco is outside Ley 19.886 and absent from
          # Mercado Público; its site lists the few calls it opens publicly.
          # See scripts/cron-codelco.ts.
          - name: Chile (Codelco)
            command: cron:codelco
          # Metro de Santiago (upcoming tenders) was here from 2026-09-26 and
          # left the same day's schedule on 2026-09-27: its site answers the
          # GitHub runners with HTTP 403, a bot gate this project does not
          # bypass. Its programme page changes every few months, so it is now
          # run by hand weekly from the user's own computer —
          # `npm run cron:metro-santiago -- --write` — and the admin banner
          # asks for it after 8 days (lib/ops/cron-jobs.ts). `optional` below
          # stays available for the next source that needs it.
          # Added 2026-09-25. Cemig's own e-Compras portal (Lei 13.303), where
          # it buys grid equipment by pregão — the one source where a pregão
          # for goods is kept. See scripts/cron-cemig.ts.
          - name: Brazil (Cemig)
            command: cron:cemig
          # Added 2026-09-25. Petroperú's own international competitions (PCI),
          # outside SEACE: a few a year, published five days back at most.
          # See scripts/cron-petroperu.ts.
          - name: Peru (Petroperú)
            command: cron:petroperu
          # Added 2026-09-26. ProInversión's Obras por Impuestos: imports the
          # in-process list, then checks every stored OxI tender against the
          # all-states list — 暂停中 when suspended, back to 招标中 when it
          # resumes, 已中标 / 流标 / 已取消 when it ends (user: 自动&手动，
          # 刷新标书状态). investinperu.pe answers this runner (probe,
          # 2026-09-25). See scripts/cron-peru-oxi.ts.
          - name: Peru (ProInversión OxI)
            command: cron:peru-oxi
          # Added 2026-09-26. Asks each source about the tenders it already
          # gave us — paused, resumed, cancelled, 流标, awarded — since the
          # imports above only re-read what was published in the last few
          # days. Brazil, Chile and Mexico here; Colombia and OxI refresh in
          # their own jobs. See scripts/cron-refresh-statuses.ts.
          - name: Status refresh (Brazil, Chile, Mexico)
            command: cron:refresh-statuses
            # On both passes (see the header); once_daily: true would limit it
            # to the evening's full pass again.
          # Added 2026-09-27. Guyana's eprocure.gov.gy: every open opportunity,
          # each notice PDF read for ICB/NCB and the lender, only large works and
          # purchases written (user: 小项目不要，只要大型工程项目或者采购项目).
          # Guyana is staged — admin pages only, see lib/staged-countries.ts.
          # Reading the notices needs poppler's pdftotext, hence `poppler`.
          - name: Guyana (eprocure, staged)
            command: cron:guyana
            poppler: true
          # Added 2026-09-27. Argentina: COMPR.AR, CONTRAT.AR, ADIF and the
          # Boletín Oficial, the platform's rules with two Argentine settings
          # (unpriced rows as Mexico's; energy, rail, power, transport, water
          # and ICT kept whatever the amount). Staged — admin pages only, see
          # lib/staged-countries.ts. COMPR.AR alone walks ~46 list pages.
          - name: Argentina (COMPR.AR, CONTRAT.AR, ADIF, Boletín Oficial, staged)
            command: cron:argentina
          # Added 2026-10-04. The Dominican Republic's DGCP open-data API: every
          # procedure of the last 3 days, the public tenders (LPN / LPI / LPA)
          # still taking bids, the platform's general rules. Opened to visitors
          # the same day (user: 公开多米尼加). See scripts/cron-dominicana.ts.
          - name: Dominican Republic (DGCP)
            command: cron:dominicana
          # Added 2026-10-06 (user: A, B都做). CFE's calls in the DOF, which
          # until then reached the platform only when an admin pressed 「DOF
          # 直接拉取」. Both CFE searches (the full name and "CFE <unit>"),
          # the last 10 days of editions, CFE's own rules. The DOF carries
          # CFE's concursos abiertos for goods and services only; works and
          # concursos simplificados are pasted from CFE's micrositio by hand.
          # See scripts/cron-cfe-dof.ts.
          - name: Mexico (CFE via DOF)
            command: cron:cfe-dof
          # Added 2026-10-04. National energy auctions kept by hand (Chile CNE,
          # Argentina AlmaSADI / AlmaGBA, Colombia MinEnergía) — open and
          # awarded — rewritten daily so an edited record reaches the site.
          # No network: the records live in lib/ingestion/energy-auctions.ts.
          - name: Energy auctions (hand-kept)
            command: cron:energy-auctions
          # Peru OECE/SEACE has no job here: measured 2026-09-26 (run
          # 36259854139), its proxy answers this runner 403 Forbidden, as it
          # answers Vercel. Its status refresh stays the local CLI
          # `npm run cron:peru-oece-status -- --write`.
    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.optional == true }}
    env:
      # True only for a once_daily job on the light pass; its steps are then
      # skipped and the job shows as succeeded with nothing done.
      SKIP: ${{ matrix.once_daily == true && needs.gate.outputs.pass == 'light' }}
    steps:
      - uses: actions/checkout@v7
        if: env.SKIP != 'true'

      - uses: actions/setup-node@v7
        if: env.SKIP != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.SKIP != 'true'

      - name: Install pdftotext
        if: ${{ env.SKIP != 'true' && matrix.poppler == true }}
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Import
        if: env.SKIP != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # A scheduled run always writes; a manual run writes only when asked,
        # so the whole thing can be exercised before it is trusted.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write }}" = "true" ]; then
            npm run ${{ matrix.command }} -- --write
          else
            npm run ${{ matrix.command }}
          fi

      - name: Upload the excluded-tenders CSV
        # Runs even on failure — a partial export is still the fastest way to
        # see what the relevance rules rejected today.
        if: always() && env.SKIP != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: excluded-${{ strategy.job-index }}-${{ github.run_id }}
          path: exports/
          if-no-files-found: ignore
          retention-days: 14

  # Tells Bing about the pages that became public today, after the imports
  # that may have created them. Bing's index is what ChatGPT and Copilot read,
  # so this is the only channel through which an AI assistant learns this site
  # exists — Google Search Console covers Google and nothing else.
  #
  # Needs the imports to have finished, but must not be skipped when one of
  # them fails: a PEMEX outage has nothing to do with yesterday's Colombia
  # tenders crossing their deadline, and those pages are the point.
  indexnow:
    needs: [gate, ingest]
    # Once a day, after the full pass (the Baidu quota is daily; see above).
    if: always() && needs.gate.outputs.run == 'true' && needs.gate.outputs.pass == 'full' && (github.event_name == 'schedule' || inputs.write)
    runs-on: ubuntu-latest
    name: IndexNow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Submit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Public information (it is the site's own address), so it is stated
          # here rather than kept as a secret nobody can read back.
          APP_URL: https://latintender.com
          # Optional. Unset → the Baidu push is skipped and only IndexNow runs.
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: npm run ping:indexnow -- --write
