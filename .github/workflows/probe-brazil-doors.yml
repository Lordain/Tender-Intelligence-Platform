# Asks the machine that actually runs the imports whether it can reach Brazil.
#
# WHY THIS IS SEPARATE FROM THE LAPTOP PROBE AND FROM THE VERCEL ROUTE.
#
# Three networks are in play and they agree about nothing:
#
#   laptop          dadosabertos.aneel.gov.br  TCP timeout, no handshake
#                   dados.antt.gov.br          200 + F5 rejection page
#   Vercel          dadosabertos.aneel.gov.br  JSON in 1473ms          ★
#                   dados.antt.gov.br          CKAN 2.8.3              ★
#   GitHub runner   ?                          ← this workflow
#
# The nightly ingest runs HERE, not on Vercel (see daily-ingest.yml for why it
# moved). So Vercel opening a door is not permission to build a connector
# against it: the connector would run on a runner, fail every night, and the
# failure would be a network refusal buried in a log nobody reads. A door
# counts as open when the machine that will use it says so.
#
# No secrets, no writes, no database. It fetches public URLs and prints a
# report. Manual only — there is nothing here worth a schedule; run it when
# the answer is about to decide what gets built.
name: Probe Brazil doors

on:
  workflow_dispatch:
    inputs:
      what:
        description: "敲门（能不能连上）还是看门后面（有没有能投的标）"
        type: choice
        default: both
        options: [doors, behind, pipeline, capture, capture-sisap, dou, watch-dou, dou-link, pncp-overlap, antaq, energy, both]
      args:
        description: "额外参数，原样传给上面选的那条命令（例如 --days 5 --all-organs）"
        type: string
        default: ""

# The capture step commits the trimmed sample back to the branch, because an
# artifact expires and cannot be fetched from the sandbox the parser is
# written in. Everything else here is read-only.
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The label is part of the report. Two reports that do not say which
      # machine produced them are worse than one.
      - name: Knock
        if: inputs.what == 'doors' || inputs.what == 'both'
        run: npm run probe:brazil-doors -- "GitHub Actions 跑批机"

      # An open page is not an open source. This step reads the links on the
      # pages that answered and scores them against the hosts this same
      # runner cannot reach — see lib/ingestion/brazil-behind-doors.ts.
      - name: Look behind
        if: inputs.what == 'behind' || inputs.what == 'both'
        run: npm run probe:brazil-behind-doors -- "GitHub Actions 跑批机"

      # The two routes that survived the scoring, followed to the column
      # contract — see lib/ingestion/brazil-pipeline-dig.ts. A dataset
      # existing is not a dataset being usable.
      - name: Dig the pipeline
        if: inputs.what == 'pipeline' || inputs.what == 'both'
        run: npm run probe:brazil-pipeline -- "GitHub Actions 跑批机"

      # The mapper gets written against the real bytes, and the real bytes are
      # only reachable from here — every .gov.br host is outside the sandbox
      # the code is written in. So the capture runs on the runner and the HTML
      # comes back as an artifact.
      - name: Capture the ANTAQ pages
        if: inputs.what == 'capture'
        run: npm run capture:antaq

      # The other eleven hearings ANTAQ lists — SisapInternet, an ASP.NET
      # application that is not gov.br and has no parser. This host has never
      # been fetched from ANY machine, so the run's first job is to say
      # whether it answers and which kind of "no" it gives if it does not.
      # Defaults to the three hearings numbered 2025 or later, per the user's
      # rule 招标中就保留，以逾期就不要; pass `--years 0` for all eleven.
      - name: Capture the ANTAQ SisapInternet pages
        if: inputs.what == 'capture-sisap'
        env:
          ARGS: ${{ inputs.args }}
        run: npm run capture:antaq-sisap -- $ARGS

      # Brazilian law requires every federal tender notice, edital and award
      # in the DOU, which makes it the one Brazilian source that is complete
      # by statute rather than by an agency's choice. Same shape this repo
      # already runs for Mexico's DOF. Door B4 answered from here.
      - name: Capture the DOU
        if: inputs.what == 'dou'
        run: npm run capture:dou -- "GitHub Actions 跑批机"

      # The watch, on the only network it works from. in.gov.br opens to this
      # runner and to Vercel, closes the socket mid-read on the user's laptop,
      # and is outside the agent sandbox's allowlist entirely — so this step
      # is not a convenience, it is the only place a real edition can be read.
      # Reports only; `scripts/watch-dou.ts` writes nothing anywhere.
      #
      # `args` goes through the environment rather than into the command line,
      # so a workflow_dispatch input cannot become a shell command. Left
      # unquoted on purpose: word splitting is what turns "--days 5
      # --all-organs" into two flags, and an env expansion is not re-evaluated.
      - name: Watch the DOU
        if: inputs.what == 'watch-dou'
        env:
          ARGS: ${{ inputs.args }}
        run: npm run watch:dou -- --days 1 $ARGS

      # The one thing about the DOU that was stated and never measured: does
      # `https://www.in.gov.br/web/dou/-/<urlTitle>` resolve, and does that
      # page carry more than the 403 characters the edition payload gives?
      # That answer decides whether the DOU can ever become an import source
      # or stays a lead radar. It has to run here: the laptop's browser test
      # returned ERR_HTTP2_PROTOCOL_ERROR, which is in.gov.br's known
      # behaviour toward that network and says nothing about the URL.
      #
      # `args=--concession --save` is the one that matters now: run #17 settled
      # that the notices this parser handles duplicate PNCP, so the open
      # question is the class PNCP cannot hold. A concession is about one row
      # in a 2,139-notice edition and the only one captured so far is an
      # erratum, so that mode scans ten weekdays by default rather than one.
      - name: Check the DOU detail-page link
        if: inputs.what == 'dou-link'
        env:
          ARGS: ${{ inputs.args }}
        run: npm run probe:dou-link -- $ARGS

      # Does PNCP already have the notices the DOU would import? Reads the
      # committed detail fixtures and asks PNCP about each one, so it needs no
      # DOU access — only PNCP. Writes nothing.
      - name: Ask whether PNCP already has them
        if: inputs.what == 'pncp-overlap'
        env:
          ARGS: ${{ inputs.args }}
        run: npm run probe:pncp-overlap -- $ARGS

      # ANTAQ's hearings, DRY RUN — no --write, and none is reachable from
      # here without one. gov.br opens to the laptop too, so this is for
      # seeing the run without one; `npm run ingest:antaq` locally is the
      # same thing.
      # Not Brazil-only any more (2026-09-25): the power, oil and mining
      # companies' own sites in Chile and Peru that the agent sandbox cannot
      # reach, asked from the machine a connector would run on. See
      # scripts/probe-energy-doors.ts.
      - name: Knock on the energy companies
        if: inputs.what == 'energy'
        run: npm run probe:energy-doors -- "GitHub Actions 跑批机"

      - name: Read the ANTAQ hearings
        if: inputs.what == 'antaq'
        env:
          ARGS: ${{ inputs.args }}
        run: npm run ingest:antaq -- $ARGS

      - name: Upload the capture
        if: inputs.what == 'capture' || inputs.what == 'capture-sisap' || inputs.what == 'dou'
        uses: actions/upload-artifact@v7
        with:
          name: brazil-capture-${{ github.run_id }}
          path: exports/
          if-no-files-found: error
          retention-days: 14

      # The artifact above expires in 14 days and lives on a host the sandbox
      # cannot reach. The trimmed sample is what the parser gets written
      # against, so it goes into the branch next to the other fixtures.
      - name: Commit the sample
        if: inputs.what == 'capture' || inputs.what == 'capture-sisap' || inputs.what == 'dou' || inputs.what == 'dou-link'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ingestion/__fixtures__/antaq lib/ingestion/__fixtures__/antaq-sisap lib/ingestion/__fixtures__/dou
          if git diff --cached --quiet; then
            echo "样本没有变化，不提交。"
            exit 0
          fi
          git commit -m "Capture: ${{ inputs.what }}, run ${{ github.run_id }}"
          git push origin HEAD:${{ github.ref_name }}
