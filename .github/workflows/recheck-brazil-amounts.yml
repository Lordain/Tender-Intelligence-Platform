# Runs scripts/recheck-brazil-amounts.ts on the machine that can reach PNCP.
#
# The script re-asks PNCP for the amount of Brazilian tenders that went in
# without one (PNCP refused the nightly lookup), re-tiers them, and with
# write=true deletes the ones the rules would have excluded and writes the
# amount and tier on the rest. A laptop usually cannot reach pncp.gov.br
# (see probe-brazil-doors.yml), so it runs here.
#
# Manual only. Run it with write unticked first and read the log; tick write
# only once the list is right (user, 2026-10-11: 只读预览，确认后再写).
name: Recheck Brazil amounts

on:
  workflow_dispatch:
    inputs:
      write:
        description: "写入数据库（先不勾，看完预览再勾）"
        type: boolean
        default: false
      hours:
        description: "检查最近多少小时入库的项目"
        type: string
        default: "36"
      import_preview:
        description: "改为试运行巴西导入（只读，不写库），用来看金额能不能取到"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Inputs reach the shell through env, never interpolated into the
      # script, so a dispatch input cannot become a command.
      - name: Recheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRITE: ${{ inputs.write }}
          HOURS: ${{ inputs.hours }}
          IMPORT_PREVIEW: ${{ inputs.import_preview }}
        run: |
          # A dry run of the nightly Brazil import, never with --write: shows
          # whether amounts come through (2026-10-12, the /itens outage).
          if [ "$IMPORT_PREVIEW" = "true" ]; then
            npm run ingest:brazil-live
          elif [ "$WRITE" = "true" ]; then
            npm run recheck:brazil-amounts -- --hours "$HOURS" --write
          else
            npm run recheck:brazil-amounts -- --hours "$HOURS"
          fi
